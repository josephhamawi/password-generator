<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PassGen">
  <title>PassGen</title>
  <!--
    The mark is the asterisk: the character every password field substitutes for
    what you typed. It sits inside the instrument bezel used throughout the app,
    with registration ticks at the corners.
  -->
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#F4F1E9"/>

    <!-- engineering grid, faint -->
    <g stroke="#16130F" stroke-opacity="0.055" stroke-width="2">
      <path d="M64 0v512M128 0v512M192 0v512M256 0v512M320 0v512M384 0v512M448 0v512"/>
      <path d="M0 64h512M0 128h512M0 192h512M0 256h512M0 320h512M0 384h512M0 448h512"/>
    </g>

    <!-- corner registration ticks -->
    <g stroke="#D93A0B" stroke-width="14" stroke-linecap="square" fill="none">
      <path d="M74 126V74h52"/>
      <path d="M386 74h52v52"/>
      <path d="M438 386v52h-52"/>
      <path d="M126 438H74v-52"/>
    </g>

    <!-- the asterisk, six strokes on 60 degree steps -->
    <g stroke="#D93A0B" stroke-width="34" stroke-linecap="round">
      <path d="M256 150v212"/>
      <path d="M164 203l184 106"/>
      <path d="M164 309l184-106"/>
    </g>
  </g>
</svg>
